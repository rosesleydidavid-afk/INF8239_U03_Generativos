[project]
name = "inf8239-u03-generative"
version = "0.1.0"
description = "Autoencoder y VAE reproducibles para INF-8239"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["matplotlib>=3.9,<4", "numpy>=2.0,<3", "scikit-learn>=1.5,<2", "streamlit>=1.40,<2"]

[project.optional-dependencies]
cpu = ["tensorflow>=2.21,<2.22"]
gpu = ["tensorflow[and-cuda]>=2.21,<2.22"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inf8239_u03_gen"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
